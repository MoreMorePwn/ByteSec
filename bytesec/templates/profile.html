{% extends 'base.html' %}
{% block title %}Edit Profile - ByteSec{% endblock %}
{% block content %}
<div class="max-w-[760px] mx-auto px-margin-mobile md:px-margin-desktop py-12 flex flex-col gap-8">

  <header class="flex flex-col gap-2">
    <p class="font-label-mono text-[12px] text-secondary uppercase tracking-wider">Account</p>
    <h1 class="font-display-lg-mobile text-display-lg-mobile text-primary font-['Hanken_Grotesk']">Edit Profile</h1>
    <p class="font-body-md text-body-md text-on-surface-variant max-w-2xl">
      Update your account email or set a new password. Your username is kept stable for leaderboard and admin references.
    </p>
  </header>

  <div class="bg-surface-container-lowest border border-border-muted rounded-xl p-6 md:p-8">
    <form method="post" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="font-label-mono text-[12px] text-on-surface-variant uppercase tracking-wider">Username</label>
        <input type="text" value="{{ g.user.username }}" disabled
               class="w-full bg-surface-container border border-outline-variant text-on-surface-variant font-body-md text-body-md px-4 py-3 rounded-lg">
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-label-mono text-[12px] text-on-surface-variant uppercase tracking-wider">Email</label>
        <input type="email" name="email" required maxlength="120" value="{{ g.user.email }}"
               class="w-full bg-surface-container border border-outline-variant text-primary font-body-md text-body-md px-4 py-3 rounded-lg outline-none focus:border-secondary transition-colors">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="font-label-mono text-[12px] text-on-surface-variant uppercase tracking-wider">New Password</label>
          <input type="password" name="password" minlength="6" autocomplete="new-password" placeholder="Leave blank to keep current"
                 class="w-full bg-surface-container border border-outline-variant text-primary font-body-md text-body-md px-4 py-3 rounded-lg outline-none focus:border-secondary transition-colors placeholder:text-on-surface-variant/50">
        </div>
        <div class="flex flex-col gap-2">
          <label class="font-label-mono text-[12px] text-on-surface-variant uppercase tracking-wider">Confirm Password</label>
          <input type="password" name="confirm_password" minlength="6" autocomplete="new-password"
                 class="w-full bg-surface-container border border-outline-variant text-primary font-body-md text-body-md px-4 py-3 rounded-lg outline-none focus:border-secondary transition-colors">
        </div>
      </div>

      <div class="flex items-center gap-4 pt-2">
        <button type="submit"
                class="bg-primary text-on-primary font-label-mono text-label-mono px-8 py-3 rounded-full hover:opacity-90 transition-opacity inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">save</span>
          Save Profile
        </button>
        <a href="{{ url_for('main.dashboard') }}"
           class="font-label-mono text-label-mono text-on-surface-variant px-6 py-3 rounded-full border border-outline-variant hover:border-secondary hover:text-secondary transition-all">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
