{% extends 'base.html' %}
{% block title %}Sign In — ByteSec{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-margin-mobile bg-grid-pattern relative overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-b from-transparent to-background opacity-90"></div>
  <!-- Matrix Rain Canvas -->
  <canvas id="matrix-canvas" class="absolute inset-0 w-full h-full opacity-[0.08] dark:opacity-[0.12] pointer-events-none"></canvas>
  <div class="relative z-10 w-full max-w-md">
    <div class="bg-surface-container-lowest border border-border-muted rounded-xl p-8 shadow-sm">
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 bg-primary-container rounded-xl flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary-container" style="font-size:28px">security</span>
        </div>
      </div>
      <h1 class="font-headline-md text-headline-md text-primary text-center mb-1">ByteSec</h1>
      <p class="font-body-md text-body-md text-on-surface-variant text-center mb-8">Sign in to continue your training</p>

      <form method="post" class="flex flex-col gap-5">
        <div>
          <label class="font-label-mono text-label-mono text-on-surface-variant block mb-1.5">Username</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
            <input type="text" name="username" placeholder="Enter your username" required
              class="w-full pl-10 pr-4 py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors">
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="font-label-mono text-label-mono text-on-surface-variant">Password</label>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
            <input type="password" name="password" placeholder="••••••••" required
              class="w-full pl-10 pr-4 py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors">
          </div>
        </div>
        <button type="submit" class="w-full bg-primary text-on-primary font-label-mono text-label-mono py-3 rounded-full hover:opacity-90 transition-opacity mt-2">
          Sign In
        </button>
      </form>

      <p class="text-center font-body-md text-body-md text-on-surface-variant mt-6">
        Don't have an account?
        <a href="{{ url_for('main.register') }}" class="text-secondary font-medium hover:underline">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Matrix Rain — ByteSec
(function(){
  const canvas = document.getElementById('matrix-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, cols = [], fontSize = 14;
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';

  function resize() {
    const parent = canvas.parentElement;
    W = canvas.width = parent.offsetWidth;
    H = canvas.height = parent.offsetHeight;
    cols = Array(Math.ceil(W / fontSize)).fill(1);
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f0';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < cols.length; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      const x = i * fontSize;
      const y = cols[i] * fontSize;
      ctx.fillText(char, x, y);
      if (y > H && Math.random() > 0.975) cols[i] = 0;
      ctx.fillStyle = y > H * 0.7 ? 'rgba(0,255,0,0.15)' : '#0f0';
      cols[i]++;
    }
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', resize);
  draw();
})();
</script>
{% endblock %}
