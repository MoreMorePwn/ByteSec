name: "Opening set"
category: Cryptography
description: |-
  My friend is obsessed with K-pop. Not casually obsessed, the kind of person who organizes playlists by comeback era and memorizes release dates down to the exact day. He has a terrible habit though. Every password he creates follows the same structure: the title followed by the release date. The release date is always formatted as: YYMMDD. 

  Recently, he got locked out of one of his accounts. He swears the password is one of his favorite K-pop titles, but he can’t remember which era he was “emotionally attached to” when he made it. To help narrow things down, I compiled a list of titles he frequently listens to. Before the account fully locked, I managed to grab a string of letters and numbers stored by the system. So like...can you recover the password please :).

  Flag format: PETIR{password}
  Example: PETIR{wearecharliekirk676767}

  Note: The intended solver/tool shouldn't take more than 5 minutes

